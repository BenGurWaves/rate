<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATE — Precision Drift Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --obsidian: #080808;
            --titanium: #A0A0A0;
            --optical: #FFFFFF;
            --titanium-dim: #6A6A6A;
            --obsidian-light: #121212;
        }

        body {
            font-family: 'Space Grotesk', 'Akzidenz-Grotesk', sans-serif;
            background: var(--obsidian);
            color: var(--optical);
            overflow: hidden;
            cursor: none;
            min-height: 100vh;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 1px solid var(--titanium);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.15s ease-out, border-color 0.2s ease;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--optical);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10001;
            transition: transform 0.05s ease-out;
        }

        .cursor.hovering {
            transform: scale(1.5);
            border-color: var(--optical);
        }

        /* Living Texture Background */
        .texture-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* Elegant Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--obsidian);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-mechanism {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .loader-gear {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--titanium);
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }

        .loader-gear::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            border: 1px solid var(--titanium-dim);
            border-radius: 50%;
        }

        .loader-gear::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: var(--titanium);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--titanium-dim);
            margin-bottom: 3rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--optical);
        }

        .brand .R {
            display: inline-block;
            position: relative;
        }

        .brand .R::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--titanium);
        }

        .attribution {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--titanium);
            text-transform: uppercase;
        }

        .attribution a {
            color: var(--titanium);
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        .attribution a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--optical);
            transition: width 0.3s ease;
        }

        .attribution a:hover {
            color: var(--optical);
        }

        .attribution a:hover::after {
            width: 100%;
        }

        /* Workspace Grid */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            flex: 1;
            align-items: center;
        }

        /* Input Panel */
        .input-panel {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .input-group {
            position: relative;
        }

        .input-label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--titanium);
            margin-bottom: 0.75rem;
        }

        .click-adjust {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--titanium-dim);
            background: rgba(18, 18, 18, 0.5);
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .click-adjust:hover {
            border-color: var(--titanium);
            background: rgba(26, 26, 26, 0.5);
        }

        .click-adjust.focused {
            border-color: var(--optical);
            background: rgba(26, 26, 26, 0.7);
        }

        .adjust-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--titanium-dim);
            background: transparent;
            color: var(--titanium);
            font-size: 1.2rem;
            cursor: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .adjust-btn:hover {
            border-color: var(--optical);
            color: var(--optical);
        }

        .adjust-value {
            flex: 1;
            font-size: 2rem;
            font-weight: 300;
            color: var(--optical);
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }

        .adjust-unit {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--titanium);
            text-transform: uppercase;
        }

        /* Reset Button */
        .reset-btn {
            padding: 1rem 2rem;
            border: 1px solid var(--titanium-dim);
            background: transparent;
            color: var(--titanium);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: none;
            transition: all 0.3s ease;
            align-self: flex-start;
        }

        .reset-btn:hover {
            border-color: var(--optical);
            color: var(--optical);
        }

        /* Result Dashboard */
        .result-dashboard {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .result-display {
            position: relative;
            padding: 2rem;
            border: 1px solid var(--titanium-dim);
            background: rgba(18, 18, 18, 0.3);
        }

        .result-label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--titanium);
            margin-bottom: 1rem;
        }

        .result-value {
            font-size: 5rem;
            font-weight: 300;
            color: var(--optical);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .result-value.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .result-unit {
            font-size: 1rem;
            color: var(--titanium);
            letter-spacing: 0.15em;
            margin-left: 0.5rem;
        }

        /* Trend Gauge */
        .gauge-container {
            position: relative;
            height: 8px;
            background: var(--obsidian-light);
            border: 1px solid var(--titanium-dim);
            margin-top: 1.5rem;
        }

        .gauge-bar {
            position: absolute;
            height: 100%;
            background: var(--titanium);
            transition: width 0.4s ease, background 0.4s ease;
            width: 50%;
            left: 0;
        }

        .gauge-bar.precise {
            background: var(--optical);
        }

        .gauge-bar.fast {
            background: #8B4513;
        }

        .gauge-bar.slow {
            background: #1E3A5F;
        }

        .gauge-markers {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding-top: 0.5rem;
        }

        .gauge-marker {
            font-size: 0.5rem;
            color: var(--titanium-dim);
            letter-spacing: 0.1em;
        }

        /* Log Window */
        .log-window {
            margin-top: 2rem;
            border: 1px solid var(--titanium-dim);
            background: rgba(18, 18, 18, 0.3);
        }

        .log-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--titanium-dim);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--titanium);
        }

        .log-entries {
            padding: 1rem;
        }

        .log-entry {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(160, 160, 160, 0.1);
            font-size: 0.75rem;
            color: var(--titanium);
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .log-entry.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .drift {
            color: var(--optical);
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 2rem;
            border-top: 1px solid var(--titanium-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-text {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            color: var(--titanium-dim);
            text-transform: uppercase;
        }

        .footer-link {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            color: var(--titanium);
            text-transform: uppercase;
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        .footer-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--optical);
            transition: width 0.3s ease;
        }

        .footer-link:hover {
            color: var(--optical);
        }

        .footer-link:hover::after {
            width: 100%;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .result-value {
                font-size: 3.5rem;
            }

            .container {
                padding: 1.5rem;
            }

            .cursor, .cursor-dot {
                display: none;
            }

            body {
                cursor: auto;
            }

            .adjust-btn, .reset-btn {
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <!-- Living Texture Canvas -->
    <canvas class="texture-canvas" id="textureCanvas"></canvas>

    <!-- Custom Cursor -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Elegant Loader -->
    <div class="loader" id="loader">
        <div class="loader-mechanism">
            <div class="loader-gear"></div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container" id="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">RATE</div>
            <div class="attribution">
                Made by <a href="https://velocity.calyvent.com" target="_blank">Velocity</a>
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <!-- Input Panel -->
            <div class="input-panel">
                <div class="input-group">
                    <div class="input-label">Time Drift</div>
                    <div class="click-adjust" id="driftAdjust">
                        <button class="adjust-btn" data-action="decrease" data-field="drift">−</button>
                        <div class="adjust-value" id="driftValue">0.0</div>
                        <button class="adjust-btn" data-action="increase" data-field="drift">+</button>
                        <div class="adjust-unit">sec</div>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-label">Duration</div>
                    <div class="click-adjust" id="durationAdjust">
                        <button class="adjust-btn" data-action="decrease" data-field="duration">−</button>
                        <div class="adjust-value" id="durationValue">0.0</div>
                        <button class="adjust-btn" data-action="increase" data-field="duration">+</button>
                        <div class="adjust-unit">hrs</div>
                    </div>
                </div>

                <button class="reset-btn" id="resetBtn">Reset</button>
            </div>

            <!-- Result Dashboard -->
            <div class="result-dashboard">
                <div class="result-display">
                    <div class="result-label">Daily Rate</div>
                    <div class="result-value" id="resultValue">
                        <span id="rateValue">0.00</span><span class="result-unit">s/d</span>
                    </div>
                    <div class="gauge-container">
                        <div class="gauge-bar" id="gaugeBar"></div>
                        <div class="gauge-markers">
                            <span class="gauge-marker">-4</span>
                            <span class="gauge-marker">0</span>
                            <span class="gauge-marker">+6</span>
                        </div>
                    </div>
                </div>

                <div class="log-window">
                    <div class="log-header">Recent Calculations</div>
                    <div class="log-entries" id="logEntries">
                        <!-- Log entries will be appended here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">Precision Instrument</div>
            <a href="https://velocity.calyvent.com" class="footer-link" target="_blank">velocity.calyvent.com</a>
        </div>
    </div>

    <script>
        // State
        let drift = 0;
        let duration = 0;
        let log = [];
        const MAX_LOG_ENTRIES = 5;

        // DOM Elements
        const driftValue = document.getElementById('driftValue');
        const durationValue = document.getElementById('durationValue');
        const rateValue = document.getElementById('rateValue');
        const resultValue = document.getElementById('resultValue');
        const gaugeBar = document.getElementById('gaugeBar');
        const logEntries = document.getElementById('logEntries');
        const resetBtn = document.getElementById('resetBtn');
        const loader = document.getElementById('loader');
        const container = document.getElementById('container');
        const cursor = document.getElementById('cursor');
        const cursorDot = document.getElementById('cursorDot');
        const textureCanvas = document.getElementById('textureCanvas');

        // Custom Cursor
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
            cursorDot.style.left = e.clientX - 2 + 'px';
            cursorDot.style.top = e.clientY - 2 + 'px';
        });

        // Cursor hover effects
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
        });

        // Living Texture
        const ctx = textureCanvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            textureCanvas.width = window.innerWidth;
            textureCanvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.floor((textureCanvas.width * textureCanvas.height) / 15000);
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * textureCanvas.width,
                    y: Math.random() * textureCanvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.3 + 0.1
                });
            }
        }

        function animateTexture() {
            ctx.clearRect(0, 0, textureCanvas.width, textureCanvas.height);
            
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = textureCanvas.width;
                if (p.x > textureCanvas.width) p.x = 0;
                if (p.y < 0) p.y = textureCanvas.height;
                if (p.y > textureCanvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(160, 160, 160, ${p.opacity})`;
                ctx.fill();
            });

            requestAnimationFrame(animateTexture);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateTexture();

        // Calculation Engine
        function calculateDailyRate() {
            if (duration === 0) return 0;
            return ((drift / duration) * 24).toFixed(2);
        }

        function updateDisplay() {
            const rate = calculateDailyRate();
            
            // Poetic transition for result
            resultValue.classList.remove('visible');
            setTimeout(() => {
                rateValue.textContent = rate;
                resultValue.classList.add('visible');
            }, 100);

            // Update gauge
            updateGauge(parseFloat(rate));

            // Log if both values are non-zero
            if (drift !== 0 && duration !== 0) {
                addToLog(drift, duration, rate);
            }
        }

        function updateGauge(rate) {
            const minRate = -4;
            const maxRate = 6;
            const range = maxRate - minRate;
            
            let percentage = ((rate - minRate) / range) * 100;
            percentage = Math.max(0, Math.min(100, percentage));
            
            gaugeBar.style.width = percentage + '%';
            
            // Color coding
            gaugeBar.classList.remove('precise', 'fast', 'slow');
            if (rate >= -4 && rate <= 6) {
                gaugeBar.classList.add('precise');
            } else if (rate > 6) {
                gaugeBar.classList.add('fast');
            } else {
                gaugeBar.classList.add('slow');
            }
        }

        function addToLog(drift, duration, rate) {
            const entry = { drift, duration, rate, timestamp: Date.now() };
            
            // Avoid duplicate consecutive entries
            if (log.length > 0 && log[0].drift === drift && log[0].duration === duration) {
                return;
            }
            
            log.unshift(entry);
            if (log.length > MAX_LOG_ENTRIES) {
                log.pop();
            }
            
            renderLog();
        }

        function renderLog() {
            logEntries.innerHTML = '';
            log.forEach((entry, index) => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerHTML = `
                    <span>${entry.drift > 0 ? '+' : ''}${entry.drift}s / ${entry.duration}h</span>
                    <span class="drift">${entry.rate > 0 ? '+' : ''}${entry.rate} s/d</span>
                `;
                logEntries.appendChild(div);
                
                // Staggered animation
                setTimeout(() => div.classList.add('visible'), index * 50);
            });
        }

        // Click-to-Adjust
        document.querySelectorAll('.adjust-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const action = btn.dataset.action;
                const field = btn.dataset.field;
                const step = field === 'drift' ? 0.5 : 0.5;
                
                if (field === 'drift') {
                    drift = action === 'increase' ? drift + step : drift - step;
                    drift = Math.round(drift * 10) / 10;
                    driftValue.textContent = drift.toFixed(1);
                } else {
                    duration = action === 'increase' ? duration + step : duration - step;
                    duration = Math.max(0, Math.round(duration * 10) / 10);
                    durationValue.textContent = duration.toFixed(1);
                }
                
                updateDisplay();
            });
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            drift = 0;
            duration = 0;
            driftValue.textContent = '0.0';
            durationValue.textContent = '0.0';
            log = [];
            renderLog();
            updateDisplay();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            const step = e.shiftKey ? 1 : 0.5;
            
            switch(e.key) {
                case 'ArrowUp':
                    drift += step;
                    drift = Math.round(drift * 10) / 10;
                    driftValue.textContent = drift.toFixed(1);
                    updateDisplay();
                    break;
                case 'ArrowDown':
                    drift -= step;
                    drift = Math.round(drift * 10) / 10;
                    driftValue.textContent = drift.toFixed(1);
                    updateDisplay();
                    break;
                case 'ArrowRight':
                    duration += step;
                    duration = Math.max(0, Math.round(duration * 10) / 10);
                    durationValue.textContent = duration.toFixed(1);
                    updateDisplay();
                    break;
                case 'ArrowLeft':
                    duration -= step;
                    duration = Math.max(0, Math.round(duration * 10) / 10);
                    durationValue.textContent = duration.toFixed(1);
                    updateDisplay();
                    break;
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            setTimeout(() => {
                loader.classList.add('hidden');
                container.classList.add('loaded');
            }, 1500);
        });
    </script>
</body>
</html>
