<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #080808;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            color: #888888;
            text-transform: uppercase;
        }

        .calculator {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 32px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-btn {
            width: 44px;
            height: 44px;
            border: 1px solid #333333;
            background: #1a1a1a;
            color: #888888;
            font-size: 18px;
            font-weight: 300;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: #222222;
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        .input-value {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            text-align: center;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 8px;
            outline: none;
        }

        .input-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #666666;
            text-transform: uppercase;
            width: 40px;
        }

        .result {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #333333;
            text-align: center;
        }

        .result-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .result-value {
            font-size: 36px;
            font-weight: 300;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .result-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
        }

        .cosc {
            margin-top: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #666666;
            text-transform: uppercase;
            padding: 6px 12px;
            background: #1a1a1a;
            border-radius: 4px;
            display: inline-block;
        }

        .cosc.within {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #666666;
            text-transform: uppercase;
        }

        .footer a {
            color: #888888;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                max-width: 100%;
            }

            .logo {
                font-size: 28px;
            }

            .calculator {
                padding: 24px;
            }

            .result-value {
                font-size: 32px;
            }

            .input-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">RATE</div>
            <div class="tagline">Precision Drift Calculator</div>
        </div>

        <!-- Calculator Card -->
        <div class="calculator">
            <!-- Drift Input -->
            <div class="input-group">
                <div class="input-label">Time Drift</div>
                <div class="input-row">
                    <button class="input-btn" id="driftDown">−</button>
                    <input type="text" class="input-value" id="driftValue" value="0.0" readonly>
                    <button class="input-btn" id="driftUp">+</button>
                    <div class="input-unit">sec</div>
                </div>
            </div>

            <!-- Duration Input -->
            <div class="input-group">
                <div class="input-label">Duration</div>
                <div class="input-row">
                    <button class="input-btn" id="durationDown">−</button>
                    <input type="text" class="input-value" id="durationValue" value="0.0" readonly>
                    <button class="input-btn" id="durationUp">+</button>
                    <div class="input-unit">hrs</div>
                </div>
            </div>

            <!-- Result -->
            <div class="result">
                <div class="result-label">Daily Rate</div>
                <div class="result-value" id="rateValue">0.00</div>
                <div class="result-unit">seconds per day</div>
                <div class="cosc" id="coscStatus">—4 / +6 COSC</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Made by <a href="https://velocity.calyvent.com" target="_blank">Velocity</a>
        </div>
    </div>

    <script>
        // State
        let drift = 0;
        let duration = 0;

        // DOM Elements
        const driftValue = document.getElementById('driftValue');
        const durationValue = document.getElementById('durationValue');
        const rateValue = document.getElementById('rateValue');
        const coscStatus = document.getElementById('coscStatus');

        // Calculation Engine
        function calculateDailyRate() {
            if (duration === 0) return 0;
            return ((drift / duration) * 24).toFixed(2);
        }

        function updateDisplay() {
            const rate = calculateDailyRate();
            rateValue.textContent = rate;
            
            const rateNum = parseFloat(rate);
            if (rateNum >= -4 && rateNum <= 6) {
                coscStatus.textContent = 'Within COSC tolerance';
                coscStatus.classList.add('within');
            } else {
                coscStatus.textContent = 'Outside COSC tolerance';
                coscStatus.classList.remove('within');
            }
        }

        function adjustValue(field, delta) {
            if (field === 'drift') {
                drift = Math.round((drift + delta) * 10) / 10;
                driftValue.value = drift.toFixed(1);
            } else {
                duration = Math.max(0, Math.round((duration + delta) * 10) / 10);
                durationValue.value = duration.toFixed(1);
            }
            updateDisplay();
        }

        // Button Handlers
        document.getElementById('driftDown').addEventListener('click', () => adjustValue('drift', -0.5));
        document.getElementById('driftUp').addEventListener('click', () => adjustValue('drift', 0.5));
        document.getElementById('durationDown').addEventListener('click', () => adjustValue('duration', -0.5));
        document.getElementById('durationUp').addEventListener('click', () => adjustValue('duration', 0.5));

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            const step = e.shiftKey ? 1 : 0.5;
            
            switch(e.key) {
                case 'ArrowUp':
                    adjustValue('drift', step);
                    break;
                case 'ArrowDown':
                    adjustValue('drift', -step);
                    break;
                case 'ArrowRight':
                    adjustValue('duration', step);
                    break;
                case 'ArrowLeft':
                    adjustValue('duration', -step);
                    break;
            }
        });
    </script>
</body>
</html>
