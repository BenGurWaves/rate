<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --obsidian: #0A0A0A;
            --titanium: #8A8A8A;
            --optical: #FAFAFA;
            --titanium-dim: #3A3A3A;
            --accent: #E5E5E5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--obsidian);
            color: var(--optical);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            color: var(--optical);
            margin-bottom: 0.75rem;
        }

        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: var(--titanium);
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Calculator Card */
        .calculator {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        /* Input Group */
        .input-group {
            margin-bottom: 1.75rem;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            color: var(--titanium);
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            color: var(--titanium);
            font-size: 1.1rem;
            font-weight: 300;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-btn:hover {
            border-color: var(--accent);
            color: var(--optical);
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        .input-value {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            color: var(--optical);
            font-variant-numeric: tabular-nums;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 0.5rem;
            outline: none;
            font-weight: 400;
        }

        .input-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            color: var(--titanium-dim);
            text-transform: uppercase;
            width: 36px;
            font-weight: 500;
        }

        /* Result Section */
        .result {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .result-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            color: var(--titanium);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--optical);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .result-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            color: var(--titanium);
            text-transform: uppercase;
            opacity: 0.8;
        }

        .cosc {
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.08em;
            color: var(--titanium-dim);
            text-transform: uppercase;
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            display: inline-block;
            font-weight: 500;
        }

        .cosc.within {
            color: #81C784;
            background: rgba(129, 199, 132, 0.1);
        }

        /* Footer */
        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.08em;
            color: var(--titanium-dim);
            text-transform: uppercase;
        }

        .footer a {
            color: var(--titanium);
            text-decoration: none;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .footer a:hover {
            color: var(--optical);
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                max-width: 100%;
            }

            .logo {
                font-size: 1.75rem;
            }

            .calculator {
                padding: 1.5rem;
            }

            .result-value {
                font-size: 2rem;
            }

            .input-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">RATE</div>
            <div class="tagline">Precision Drift Calculator</div>
        </div>

        <!-- Calculator Card -->
        <div class="calculator">
            <!-- Drift Input -->
            <div class="input-group">
                <div class="input-label">Time Drift</div>
                <div class="input-row">
                    <button class="input-btn" id="driftDown">−</button>
                    <input type="text" class="input-value" id="driftValue" value="0.0" readonly>
                    <button class="input-btn" id="driftUp">+</button>
                    <div class="input-unit">sec</div>
                </div>
            </div>

            <!-- Duration Input -->
            <div class="input-group">
                <div class="input-label">Duration</div>
                <div class="input-row">
                    <button class="input-btn" id="durationDown">−</button>
                    <input type="text" class="input-value" id="durationValue" value="0.0" readonly>
                    <button class="input-btn" id="durationUp">+</button>
                    <div class="input-unit">hrs</div>
                </div>
            </div>

            <!-- Result -->
            <div class="result">
                <div class="result-label">Daily Rate</div>
                <div class="result-value" id="rateValue">0.00</div>
                <div class="result-unit">seconds per day</div>
                <div class="cosc" id="coscStatus">—4 / +6 COSC</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Made by <a href="https://velocity.calyvent.com" target="_blank">Velocity</a>
        </div>
    </div>

    <script>
        // State
        let drift = 0;
        let duration = 0;

        // DOM Elements
        const driftValue = document.getElementById('driftValue');
        const durationValue = document.getElementById('durationValue');
        const rateValue = document.getElementById('rateValue');
        const coscStatus = document.getElementById('coscStatus');
        const container = document.getElementById('container');

        // Show container
        setTimeout(() => {
            container.classList.add('visible');
        }, 100);

        // Calculation Engine
        function calculateDailyRate() {
            if (duration === 0) return 0;
            return ((drift / duration) * 24).toFixed(2);
        }

        function updateDisplay() {
            const rate = calculateDailyRate();
            rateValue.textContent = rate;
            
            // COSC Status
            const rateNum = parseFloat(rate);
            if (rateNum >= -4 && rateNum <= 6) {
                coscStatus.textContent = 'Within COSC tolerance';
                coscStatus.classList.add('within');
            } else {
                coscStatus.textContent = 'Outside COSC tolerance';
                coscStatus.classList.remove('within');
            }
        }

        // Button Handlers
        document.getElementById('driftDown').addEventListener('click', () => {
            drift = Math.round((drift - 0.5) * 10) / 10;
            driftValue.value = drift.toFixed(1);
            updateDisplay();
        });

        document.getElementById('driftUp').addEventListener('click', () => {
            drift = Math.round((drift + 0.5) * 10) / 10;
            driftValue.value = drift.toFixed(1);
            updateDisplay();
        });

        document.getElementById('durationDown').addEventListener('click', () => {
            duration = Math.max(0, Math.round((duration - 0.5) * 10) / 10);
            durationValue.value = duration.toFixed(1);
            updateDisplay();
        });

        document.getElementById('durationUp').addEventListener('click', () => {
            duration = Math.round((duration + 0.5) * 10) / 10;
            durationValue.value = duration.toFixed(1);
            updateDisplay();
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            const step = e.shiftKey ? 1 : 0.5;
            
            switch(e.key) {
                case 'ArrowUp':
                    drift = Math.round((drift + step) * 10) / 10;
                    driftValue.value = drift.toFixed(1);
                    updateDisplay();
                    break;
                case 'ArrowDown':
                    drift = Math.round((drift - step) * 10) / 10;
                    driftValue.value = drift.toFixed(1);
                    updateDisplay();
                    break;
                case 'ArrowRight':
                    duration = Math.round((duration + step) * 10) / 10;
                    durationValue.value = duration.toFixed(1);
                    updateDisplay();
                    break;
                case 'ArrowLeft':
                    duration = Math.max(0, Math.round((duration - step) * 10) / 10);
                    durationValue.value = duration.toFixed(1);
                    updateDisplay();
                    break;
            }
        });
    </script>
</body>
</html>
